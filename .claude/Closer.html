<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Closer · 成交官 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ Design tokens — 严格对齐《成交官》前端设计规范 7.3 / 7.4 ============ */
:root{
  /* 色彩 7.3 */
  --primary:#1F5C8C;
  --primary-2:#19496f;      /* hover/active 加深 */
  --primary-light:#DCE9F2;
  --primary-tint:#EDF3F8;   /* 更浅的信息底 */
  --green:#2E9E8F;          /* 成交 / A 级 */
  --green-light:#E2F1EE;
  --orange:#E8A13A;         /* 待处理 / 跟进 / B 级 */
  --orange-light:#FBEFD9;
  --red:#D9534F;            /* 底价红线 / 危险 */
  --red-light:#FAE6E5;
  --text:#1B2733;
  --text-2:#5C6B7A;
  --text-3:#94A2AF;
  --border:#E4E9ED;
  --border-2:#EEF1F4;
  --bg:#F5F7F9;
  --white:#FFFFFF;
  --c-grey:#8A94A0;         /* C 级 / 次要 */
  --c-grey-light:#EDF0F2;
  /* 科技光感主线（可被主题覆盖） */
  --tech:#3EA0E0;           /* 电蓝 accent */
  --tech-2:#5BB8E8;
  --tech-deep:#2C7FC0;
  --ai-grad:linear-gradient(135deg,#4FB0E8 0%,#2C7FC0 100%);
  --ai-glow:0 0 0 1px rgba(62,160,224,.22),0 6px 18px -4px rgba(44,127,192,.40);

  /* ===== 主题化「机身」令牌（默认：极光蓝 Aurora，浅色侧栏）===== */
  --dot:color-mix(in srgb,var(--primary) 5%,transparent);
  --side-bg-1:#FCFDFE;
  --side-bg-2:#F3F6F9;
  --side-border:var(--border-2);
  --side-text:var(--text-2);
  --side-text-strong:var(--text);
  --side-section:var(--text-3);
  --side-hover:color-mix(in srgb,var(--primary) 6%,transparent);
  --side-active-bg:#ffffff;
  --side-active-text:var(--primary);
  --side-active-shadow:0 1px 2px rgba(16,33,48,.07),0 2px 8px -4px rgba(16,33,48,.10),inset 0 0 0 1px color-mix(in srgb,var(--primary) 10%,transparent);
  --side-accent:linear-gradient(180deg,var(--tech-2),var(--primary));
  --side-card-bg:linear-gradient(135deg,color-mix(in srgb,var(--tech) 12%,transparent),color-mix(in srgb,var(--primary) 7%,transparent));
  --side-card-border:color-mix(in srgb,var(--tech) 22%,transparent);
  --side-card-title:var(--primary);
  --side-card-sub:var(--text-2);
  --side-progress-track:color-mix(in srgb,var(--primary) 12%,transparent);
  --logo-word:var(--text);
  --hero-grad:linear-gradient(120deg,#13212E 0%,#1C3A52 55%,#1F5C8C 130%);
  --hero-glow:radial-gradient(circle,rgba(62,160,224,.34),transparent 62%);
  --topbar-bg:rgba(255,255,255,.82);

  /* 字体 7.4 */
  --font:"Inter","PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --mono:"Roboto Mono","SF Mono",ui-monospace,monospace;

  /* 8px 栅格 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --radius:9px; --radius-sm:7px; --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,33,48,.05),0 1px 1px rgba(16,33,48,.03);
  --shadow:0 1px 3px rgba(16,33,48,.05),0 8px 20px -6px rgba(16,33,48,.08);
  --shadow-lg:0 20px 48px -12px rgba(16,33,48,.20),0 6px 16px -8px rgba(16,33,48,.10);
  --shadow-drawer:-12px 0 40px -8px rgba(16,33,48,.16);
  --nav-w:238px;
  --topbar-h:62px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font);
  color:var(--text);
  background:var(--bg);
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:22px 22px;
  background-position:-1px -1px;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#root{height:100vh;overflow-x:auto;overflow-y:hidden;}
#app-shell{min-width:1180px;}

/* ===================== 主题皮肤 ===================== */
/* 深空 · 暗色侧栏 */
[data-theme="midnight"]{
  --tech:#48A8E8; --tech-2:#6BBDF0; --tech-deep:#2C7FC0;
  --ai-grad:linear-gradient(135deg,#6BBDF0,#2C7FC0);
  --bg:#F4F6F8;
  --side-bg-1:#16252F; --side-bg-2:#0E1A23; --side-border:rgba(255,255,255,.06);
  --side-text:#93A6B6; --side-text-strong:#EAF1F6; --side-section:#62768A;
  --side-hover:rgba(255,255,255,.06);
  --side-active-bg:rgba(72,168,232,.16); --side-active-text:#ffffff;
  --side-active-shadow:inset 0 0 0 1px rgba(72,168,232,.32);
  --side-accent:linear-gradient(180deg,#6BBDF0,#48A8E8);
  --side-card-bg:rgba(72,168,232,.12); --side-card-border:rgba(72,168,232,.24);
  --side-card-title:#CFE7F7; --side-card-sub:#93A6B6; --side-progress-track:rgba(255,255,255,.12);
  --hero-grad:linear-gradient(120deg,#0E1A23 0%,#163049 55%,#1F5C8C 130%);
  --hero-glow:radial-gradient(circle,rgba(72,168,232,.38),transparent 62%);
}
/* 石墨 · 极简单色 */
[data-theme="graphite"]{
  --primary:#3A4757; --primary-2:#2C3845; --primary-light:#DEE3E8; --primary-tint:#EFF1F4;
  --tech:#6E8BA8; --tech-2:#8FA8C2; --tech-deep:#4F6A85;
  --ai-grad:linear-gradient(135deg,#8FA8C2,#4F6A85);
  --bg:#F6F7F9;
  --side-bg-1:#FBFBFC; --side-bg-2:#F0F2F4;
  --hero-grad:linear-gradient(120deg,#272F38 0%,#3A4757 60%,#4D5D6E 130%);
  --hero-glow:radial-gradient(circle,rgba(143,168,194,.26),transparent 62%);
}
/* 暖砂 · 商务暖 */
[data-theme="sand"]{
  --primary:#42566E; --primary-2:#34465c; --primary-light:#DCE2EA; --primary-tint:#EFEDE8;
  --tech:#B0894F; --tech-2:#C9A669; --tech-deep:#8E6C39;
  --ai-grad:linear-gradient(135deg,#C9A669,#8E6C39);
  --bg:#F6F2EC;
  --dot:color-mix(in srgb,#8E6C39 7%,transparent);
  --side-bg-1:#FBF9F5; --side-bg-2:#F0EBE2; --side-border:#E8E1D5;
  --hero-grad:linear-gradient(120deg,#2B2723 0%,#3E3A33 55%,#5A5246 130%);
  --hero-glow:radial-gradient(circle,rgba(201,166,105,.30),transparent 62%);
}
/* 靛紫 · 科技 */
[data-theme="indigo"]{
  --primary:#4C4FB8; --primary-2:#3d40a0; --primary-light:#DEDFF4; --primary-tint:#EEEEFA;
  --tech:#7C6CF0; --tech-2:#9A8DF5; --tech-deep:#5B4FD0;
  --ai-grad:linear-gradient(135deg,#9A8DF5,#5B4FD0);
  --bg:#F6F6FB;
  --side-bg-1:#FCFCFE; --side-bg-2:#F1F1F9;
  --hero-grad:linear-gradient(120deg,#1E1B3A 0%,#2E2A63 55%,#4C4FB8 130%);
  --hero-glow:radial-gradient(circle,rgba(124,108,240,.34),transparent 62%);
}

/* 排版层级 7.4 */
.h1{font-size:27px;font-weight:700;line-height:1.25;letter-spacing:-.022em;}
.h2{font-size:20px;font-weight:600;line-height:1.35;letter-spacing:-.01em;}
.h3{font-size:16px;font-weight:600;line-height:1.4;letter-spacing:-.005em;}
.body{font-size:14px;font-weight:400;}
.aux{font-size:12px;font-weight:400;color:var(--text-2);}
.num{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#d8dde2;border-radius:6px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:#c4cbd2;background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ 按钮 7.5 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:36px;padding:0 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;
  white-space:nowrap;transition:background .14s,border-color .14s,box-shadow .14s,color .14s;user-select:none;}
.btn svg{flex:none;}
.btn-pri{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(20,34,47,.24),inset 0 1px 0 rgba(255,255,255,.14);}
.btn-pri:hover{background:var(--primary-2);box-shadow:0 2px 8px rgba(31,92,140,.3),inset 0 1px 0 rgba(255,255,255,.14);}
.btn-sec{background:#fff;color:var(--text);border:1px solid var(--border);}
.btn-sec:hover{border-color:#c7ced4;background:#fafbfc;}
.btn-ghost{background:transparent;color:var(--text-2);}
.btn-ghost:hover{background:#eef1f4;color:var(--text);}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{background:#c4413d;}
.btn-danger-o{background:#fff;color:var(--red);border:1px solid var(--red);}
.btn-danger-o:hover{background:var(--red-light);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:#268376;}
.btn-sm{height:30px;padding:0 12px;font-size:13px;}
.btn-lg{height:42px;padding:0 22px;font-size:15px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border-radius:var(--radius-sm);}

/* ============ 徽章 / 标签 7.5 ============ */
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:5px;
  font-size:12px;font-weight:600;line-height:1;white-space:nowrap;}
.grade{width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;}
.grade-A{background:var(--green);}
.grade-B{background:var(--orange);}
.grade-C{background:var(--c-grey);}
.badge-A{background:var(--green-light);color:#1f7568;}
.badge-B{background:var(--orange-light);color:#a06916;}
.badge-C{background:var(--c-grey-light);color:#6b7480;}
.badge-pri{background:var(--primary-light);color:var(--primary);}
.badge-red{background:var(--red-light);color:#b53d39;}
.badge-green{background:var(--green-light);color:#1f7568;}
.badge-grey{background:var(--c-grey-light);color:#6b7480;}

/* 状态药丸（色+图标+文字 三重表达 9.1） */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;
  font-size:12.5px;font-weight:600;white-space:nowrap;}
.pill svg{flex:none;}
.pill-ai{background:var(--primary-light);color:var(--primary);}
.pill-pending{background:var(--orange-light);color:#a06916;}
.pill-human{background:#eceff2;color:#4a5560;}
.pill-deal{background:var(--green-light);color:#1f7568;}
.pill-guard{background:var(--red-light);color:#b53d39;}
.dot{width:7px;height:7px;border-radius:50%;flex:none;}
.dot-live{box-shadow:0 0 0 0 rgba(46,158,143,.5);animation:pulse 1.8s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,158,143,.45);}70%{box-shadow:0 0 0 6px rgba(46,158,143,0);}100%{box-shadow:0 0 0 0 rgba(46,158,143,0);}}

/* ============ 卡片 7.5 ============ */
.card{background:#fff;border:1px solid var(--border-2);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
.card-pad{padding:20px;}
.card-hover{transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,border-color .16s;}
.card-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border);}

/* 通用 */
.row{display:flex;align-items:center;}
.col{display:flex;flex-direction:column;}
.gap1{gap:4px;}.gap2{gap:8px;}.gap3{gap:12px;}.gap4{gap:16px;}.gap5{gap:24px;}
.spread{justify-content:space-between;}
.center{align-items:center;justify-content:center;}
.muted{color:var(--text-2);}
.faint{color:var(--text-3);}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.tnum{font-variant-numeric:tabular-nums;}
.divider{height:1px;background:var(--border-2);width:100%;}
.vline{width:1px;background:var(--border-2);align-self:stretch;}
.clickable{cursor:pointer;}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.flag{font-size:15px;line-height:1;}

/* 输入 */
.input{height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px;width:100%;
  background:#fff;transition:border-color .14s,box-shadow .14s;}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,92,140,.12);}
.input::placeholder{color:var(--text-3);}
textarea.input{height:auto;padding:10px 12px;resize:none;line-height:1.5;}
.field-label{font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;}

/* 开关 */
.switch{width:38px;height:22px;border-radius:11px;background:#cdd4da;position:relative;transition:background .18s;flex:none;cursor:pointer;}
.switch.on{background:var(--green);}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .18s;}
.switch.on::after{transform:translateX(16px);}

/* 滚动区 */
.scroll{overflow-y:auto;overflow-x:hidden;}
.page-scroll{height:100%;overflow-y:auto;}

/* 进场动画 — 静止态始终可见（仅位移，不靠透明度），保证截图/打印/降级时内容不消失 */
@keyframes fadeUp{from{transform:translateY(9px);}to{transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideInRight{from{transform:translateX(20px);}to{transform:none;}}
@keyframes drawerIn{from{transform:translateX(100%);}to{transform:none;}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:none;}}
.anim-up{animation:fadeUp .34s cubic-bezier(.2,.7,.3,1) both;}
.anim-in{animation:fadeIn .3s ease both;}
@media (prefers-reduced-motion: reduce){.anim-up,.anim-in{animation:none;}}

/* tooltip-ish */
.kbd{font-family:var(--mono);font-size:11px;background:#eef1f4;border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--text-2);}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--text-2);padding:10px 14px;border-bottom:1px solid var(--border);background:#fafbfc;position:sticky;top:0;}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border-2);}
.tbl tbody tr:hover{background:#fafbfc;}
.tbl tbody tr:nth-child(even){background:#fcfcfd;}
.tbl tbody tr:nth-child(even):hover{background:#f7f9fa;}

.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#262b30;color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:fadeUp .26s both;}
.toast .dot{width:8px;height:8px;}

/* ============ 主题化侧边栏 ============ */
.sidebar{width:var(--nav-w);flex:none;height:100%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--side-bg-1) 0%,var(--side-bg-2) 100%);
  border-right:1px solid var(--side-border);position:relative;transition:width .18s cubic-bezier(.2,.7,.3,1);}
.sidebar-collapsed{--nav-w:72px;}
.navlink{width:100%;padding:9px 11px;border-radius:10px;margin-bottom:2px;display:flex;align-items:center;justify-content:space-between;
  color:var(--side-text);font-weight:500;font-size:13.5px;transition:background .14s,color .14s,box-shadow .14s;position:relative;}
.navlink:hover{background:var(--side-hover);color:var(--side-text-strong);}
.navlink.active{background:var(--side-active-bg);color:var(--side-active-text);font-weight:600;box-shadow:var(--side-active-shadow);}
.navlink.active::before{content:"";position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:3px;height:17px;border-radius:3px;background:var(--side-accent);}
.navlink.active svg{color:var(--side-active-text);}
.nav-section{padding:8px 11px 5px;font-size:10.5px;font-weight:700;color:var(--side-section);letter-spacing:.08em;text-transform:uppercase;}

/* 数字滚动入场（仅位移，静止态可见） */
@keyframes countUp{from{transform:translateY(7px);}to{transform:none;}}

/* 顶栏玻璃感 */
.topbar{height:var(--topbar-h);background:var(--topbar-bg);backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--border-2);flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;}

/* 细节：选区/链接 */
::selection{background:rgba(62,160,224,.20);}
a{color:var(--primary);text-decoration:none;}

/* 科技光感主线：AI 发光元素 */
.ai-avatar{background:var(--ai-grad)!important;box-shadow:0 4px 14px -3px rgba(44,127,192,.5),inset 0 1px 0 rgba(255,255,255,.3)!important;}
.pill-ai{background:linear-gradient(135deg,color-mix(in srgb,var(--tech) 18%,transparent),color-mix(in srgb,var(--tech) 10%,transparent))!important;color:var(--tech-deep)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tech) 22%,transparent);}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(62,160,224,0);}50%{box-shadow:0 0 13px 1px rgba(62,160,224,.34);}}
.live-glow{animation:glowPulse 2.2s ease-in-out infinite;}
/* 渐变发丝描边：关键卡片顶部光线 */
.topline{position:relative;}
.topline::before{content:"";position:absolute;top:0;left:18px;right:18px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--tech),transparent);opacity:.5;}

/* 微光分隔的区块标题 */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);}

</style>
</head>

<script type="text/babel">
/* ===== ui.jsx ===== */
/* ============ UI 原语 ============ */
const {useState, useEffect, useRef, useCallback, createContext, useContext} = React;

/* 分级方块 A/B/C */
function Grade({g, size}){
  return <span className={`grade grade-${g}`} style={size?{width:size,height:size,fontSize:size*.55}:null}>{g}</span>;
}

/* 渠道图标圆点 */
function ChannelIcon({ch, size=26}){
  const c = CHANNELS[ch] || CHANNELS.email;
  return (
    <span title={c.name} style={{width:size,height:size,borderRadius:7,display:'inline-flex',
      alignItems:'center',justifyContent:'center',background:c.color+'15',color:c.color,flex:'none'}}>
      <Icon name={c.icon} size={size*.62} strokeWidth={1.8}/>
    </span>
  );
}

/* 状态药丸（色+图标+文字） */
function StatusPill({status, sm}){
  const m = STATUS_META[status]; if(!m) return null;
  return (
    <span className={`pill ${m.pill}`} style={sm?{height:22,fontSize:11.5,padding:'0 8px'}:null}>
      <Icon name={m.icon} size={sm?12:13} strokeWidth={1.9}/>{m.label}
    </span>
  );
}

/* 头像（首字母或机器人） */
function Avatar({type='human', name='', size=32, src}){
  if(type==='ai'){
    return <span className="ai-avatar" style={{width:size,height:size,borderRadius:'50%',color:'#fff',
      display:'inline-flex',alignItems:'center',justifyContent:'center',flex:'none'}}>
      <Icon name="bot" size={size*.56} strokeWidth={1.8}/></span>;
  }
  const initials = (name||'?').replace(/[^A-Za-z\u4e00-\u9fa5 ]/g,'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  const palette=['#1F5C8C','#2E9E8F','#E8A13A','#7B6BA8','#C25E7A'];
  const idx=(name||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0)%palette.length;
  return <span style={{width:size,height:size,borderRadius:'50%',background:palette[idx]+'1a',color:palette[idx],
    fontWeight:600,fontSize:size*.4,display:'inline-flex',alignItems:'center',justifyContent:'center',flex:'none'}}>{initials||'·'}</span>;
}

/* 国旗 + 国家 */
function FlagLabel({flag, country, className}){
  return <span className={`row gap1 ${className||''}`} style={{alignItems:'center'}}>
    <span className="flag">{flag}</span>{country&&<span className="aux">{country}</span>}</span>;
}

/* 货币 */
function fmtMoney(n, cur='$'){
  if(n==null) return '—';
  return cur + n.toLocaleString('en-US');
}

/* 迷你 sparkline */
function Spark({data, color='var(--primary)', w=88, h=30}){
  if(!data||!data.length) return null;
  const max=Math.max(...data), min=Math.min(...data), rng=max-min||1;
  const pts=data.map((v,i)=>[i/(data.length-1)*w, h-2-((v-min)/rng)*(h-6)]);
  const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=`${d} L${w},${h} L0,${h} Z`;
  const gid='sg'+Math.random().toString(36).slice(2,7);
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}>
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stopColor={color} stopOpacity=".18"/><stop offset="1" stopColor={color} stopOpacity="0"/></linearGradient></defs>
      <path d={area} fill={`url(#${gid})`}/>
      <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2.6" fill="#fff" stroke={color} strokeWidth="2"/>
    </svg>
  );
}

/* 指标卡 */
function StatCard({icon, label, value, delta, up, accent, alert, spark, onClick}){
  return (
    <div className="card card-hover clickable anim-up" onClick={onClick} style={{padding:'18px 20px',position:'relative',overflow:'hidden'}}>
      {alert&&<span style={{position:'absolute',top:16,right:16,width:8,height:8,borderRadius:'50%',background:'var(--red)',boxShadow:'0 0 0 3px rgba(217,83,79,.15)'}}></span>}
      <div className="row gap2" style={{marginBottom:14}}>
        <span style={{width:34,height:34,borderRadius:9,background:(accent||'var(--primary)')+'14',color:accent||'var(--primary)',
          display:'inline-flex',alignItems:'center',justifyContent:'center'}}><Icon name={icon} size={18}/></span>
        <span className="aux" style={{fontWeight:600,color:'var(--text-2)'}}>{label}</span>
      </div>
      <div className="row spread" style={{alignItems:'flex-end'}}>
        <div className="col" style={{gap:6}}>
          <span className="num" style={{fontSize:32,fontWeight:600,color:'var(--text)',lineHeight:1,letterSpacing:'-.02em',animation:'countUp .5s both'}}>{value}</span>
          {delta&&<span style={{display:'inline-flex',alignItems:'center',gap:3,fontSize:11.5,fontWeight:600,padding:'2px 7px',borderRadius:6,width:'fit-content',
            background:up===true?'var(--green-light)':up===false?'var(--red-light)':'var(--orange-light)',
            color:up===true?'#1f7568':up===false?'#b53d39':'#a06916'}}>
            {up===true&&'▲'}{up===false&&'▼'} {delta}</span>}
        </div>
        {spark&&<Spark data={spark} color={accent||'var(--primary)'}/>}
      </div>
    </div>
  );
}

/* 段落标题 */
function SectionTitle({children, icon, right, sub}){
  return (
    <div className="row spread" style={{marginBottom:14}}>
      <div className="col" style={{minWidth:0}}>
        <div className="row gap2">
          {icon&&<span style={{color:'var(--primary)'}}><Icon name={icon} size={18}/></span>}
          <span className="h3" style={{whiteSpace:'nowrap'}}>{children}</span>
        </div>
        {sub&&<span className="aux" style={{marginTop:2,whiteSpace:'nowrap'}}>{sub}</span>}
      </div>
      {right}
    </div>
  );
}

/* 空状态 */
function Empty({icon='inbox', title, desc, action}){
  return (
    <div className="col center" style={{padding:'56px 24px',textAlign:'center',gap:10}}>
      <span style={{width:56,height:56,borderRadius:14,background:'var(--primary-tint)',color:'var(--primary)',
        display:'inline-flex',alignItems:'center',justifyContent:'center'}}><Icon name={icon} size={26}/></span>
      <div className="h3" style={{marginTop:4}}>{title}</div>
      {desc&&<div className="aux" style={{maxWidth:300}}>{desc}</div>}
      {action}
    </div>
  );
}

/* ============ Toast 系统 ============ */
const ToastCtx = createContext(()=>{});
function useToast(){ return useContext(ToastCtx); }
function ToastHost({children}){
  const [items,setItems]=useState([]);
  const push=useCallback((msg, kind='ok')=>{
    const id=Math.random().toString(36).slice(2);
    setItems(s=>[...s,{id,msg,kind}]);
    setTimeout(()=>setItems(s=>s.filter(t=>t.id!==id)), 2800);
  },[]);
  const color={ok:'var(--green)',info:'var(--primary)',warn:'var(--orange)',danger:'var(--red)'};
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-wrap">
        {items.map(t=>(
          <div className="toast" key={t.id}>
            <span className="dot" style={{background:color[t.kind]||'var(--green)'}}></span>{t.msg}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

/* 进度环 */
function Ring({pct, size=44, stroke=4, color='var(--primary)'}){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return (
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={c*(1-pct/100)} strokeLinecap="round"
        style={{transition:'stroke-dashoffset .6s ease'}}/>
    </svg>
  );
}

/* 抽屉容器 */
function Drawer({open, onClose, width=380, children, title}){
  if(!open) return null;
  return (
    <div style={{position:'absolute',inset:0,zIndex:60}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(38,38,38,.28)',animation:'fadeIn .2s both'}}></div>
      <div style={{position:'absolute',top:0,right:0,bottom:0,width,background:'#fff',boxShadow:'var(--shadow-drawer)',
        animation:'drawerIn .26s cubic-bezier(.2,.7,.3,1) both',display:'flex',flexDirection:'column'}}>
        {title&&<div className="row spread" style={{padding:'16px 20px',borderBottom:'1px solid var(--border-2)',flex:'none'}}>
          <span className="h3">{title}</span>
          <button className="btn-icon btn-ghost" onClick={onClose}><Icon name="x" size={18}/></button>
        </div>}
        <div className="scroll" style={{flex:1}}>{children}</div>
      </div>
    </div>
  );
}

/* 简易模态 */
function Modal({open, onClose, width=460, children}){
  if(!open) return null;
  return (
    <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(38,38,38,.34)',animation:'fadeIn .18s both'}}></div>
      <div className="card" style={{position:'relative',width,maxWidth:'92vw',maxHeight:'88vh',overflow:'auto',
        boxShadow:'var(--shadow-lg)',animation:'scaleIn .22s both'}}>{children}</div>
    </div>
  );
}

Object.assign(window, {
  Grade, ChannelIcon, StatusPill, Avatar, FlagLabel, fmtMoney, StatCard, Spark,
  SectionTitle, Empty, ToastHost, useToast, Ring, Drawer, Modal,
});

</script>

              <div>{m.zh}</div>
              <div style={{display:'flex',alignItems:'center',gap:6,margin:'8px 0 6px'}}>
                <span style={{flex:1,height:1,background:side==='left'?'var(--border-2)':'rgba(31,92,140,.14)'}}></span>
                <span style={{display:'inline-flex',alignItems:'center',gap:3,fontSize:10.5,fontWeight:600,color:'var(--text-3)',whiteSpace:'nowrap'}}>
                  <Icon name="language" size={11}/>{origLabel}</span>
                <span style={{flex:1,height:1,background:side==='left'?'var(--border-2)':'rgba(31,92,140,.14)'}}></span>
              </div>
              <div style={{fontSize:12,color:'var(--text-3)',lineHeight:1.55}}>{m.text}</div>
            </>
          ) : m.text}
        </div>
        <div className="aux" style={{textAlign:side==='left'?'left':'right',marginTop:3,fontSize:11}}>{m.time}{bilingual&&<span style={{color:'var(--tech-deep)'}}> · 已自动翻译</span>}</div>
      </div>
      {side==='right'&&(isAI?<Avatar type="ai" size={30}/>:<Avatar name={SELLER.name} size={30}/>)}
    </div>
  );
}

function Typing(){
  return (
    <div className="row gap2 anim-in" style={{alignItems:'flex-end'}}>
      <Avatar type="ai" size={30}/>
      <div style={{background:'var(--primary-tint)',border:'1px solid var(--primary-light)',borderRadius:12,borderBottomLeftRadius:3,padding:'12px 14px'}}>
        <div className="row gap1">
          {[0,1,2].map(i=><span key={i} style={{width:6,height:6,borderRadius:'50%',background:'var(--primary)',opacity:.5,
            animation:`pulse 1s ${i*.2}s infinite`}}></span>)}
        </div>
      </div>
    </div>
  );
}

window.QuoteComponents = {QuoteCard, ScreeningCard, UnderstandCard, GuardrailBanner, Bubble, Typing};

</script>
<script type="text/babel">
/* ===== inbox.jsx ===== */
/* ============ 智能询盘 — 四桶结构 ============ */
const {QuoteCard, ScreeningCard, UnderstandCard, GuardrailBanner, Bubble, Typing} = window.QuoteComponents;

/* ── 轻量对话生成（非主询盘） ── */
function lightThread(inq){
  const base=[{id:'l1',role:'customer',lang:'EN',time:inq.time,who:inq.contact,
    text:`Hi, this is ${inq.contact} from ${inq.company}. ${inq.title}. Could you advise on pricing and lead time?`,
    zh:`你好，我是 ${inq.company} 的 ${inq.contact}。${inq.title}。能否告知报价与交期？`}];
  if(inq.status==='screened'){
    base.push({id:'l2',role:'screening',grade:'C',time:inq.time,
      signals:[{label:'通用群发措辞，无具体规格/数量',ok:false},{label:'免费邮箱 + 多次群发特征',ok:false}],
      note:'综合评分 24/100 → 判定 C 级（疑似同行套价），已降级、未自动报价，保留备查。'});
    return base;
  }
  const aiText = inq.status==='deal'
      ? `Thank you! I've issued the PI for your order. We're delighted to move forward — welcome aboard 🎉`
      : inq.status==='followup'
      ? `Following up on my earlier message — happy to tailor a quote once you confirm quantity. No rush!`
      : `Thanks for reaching out! I've prepared the details you asked for below and I'm here for any questions.`;
  const aiZh = inq.status==='deal'
      ? `谢谢！我已为你的订单出具 PI，很高兴继续推进——欢迎合作 🎉`
      : inq.status==='followup'
      ? `跟进一下我之前的消息——你确认数量后我很乐意定制报价，不着急！`
      : `感谢联系！我已在下方准备好你需要的资料，有任何问题随时找我。`;
  base.push({id:'l2',role:'ai',lang:'EN',time:inq.time,text:aiText,zh:aiZh});
  return base;
}

/* ── 会话视图 ── */
function ConversationView({inq, onOpenProfile}){
  const isHero = inq.id==='inq-1';
  const [msgs,setMsgs]=useState(()=>isHero?THREAD:lightThread(inq));
  const [mode,setMode]=useState(inq.status==='human'?'human':'ai');
  const [resolved,setResolved]=useState(inq.status!=='guardrail');
  const [status,setStatus]=useState(inq.status);
  const [draft,setDraft]=useState('');
  const [typing,setTyping]=useState(false);
  const [editOpen,setEditOpen]=useState(false);
  const [done,setDone]=useState(inq.status==='deal');
  const [translate,setTranslate]=useState(true);
  const scrollRef=useRef(null);
  const toast=useToast();

  useEffect(()=>{
    setMsgs(isHero?THREAD:lightThread(inq)); setMode(inq.status==='human'?'human':'ai');
    setResolved(inq.status!=='guardrail'); setStatus(inq.status); setDone(inq.status==='deal'); setDraft('');
  },[inq.id]);

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[msgs,typing]);

  const append=(m)=>setMsgs(s=>[...s,{...m,id:'x'+Date.now()+Math.random()}]);
  const resolveGuard=(humanMode)=>{ setResolved(true); if(humanMode){setMode('human');setStatus('human');} };

  const approveSuggestion=()=>{
    setTyping(true);
    setTimeout(()=>{ setTyping(false);
      append({role:'ai',lang:'EN',time:'09:36',
        text:`Sanne, I can meet you at $168/set CIF Rotterdam for 300 sets — and I'll include cargo insurance at no extra cost. For terms: 70% before shipment, balance net-30 after arrival. This keeps us within a fair margin. Shall I update the PI?`,
        zh:`Sanne，300 套我可以给到 $168/套 CIF 鹿特丹，并免费附加货运保险。账期方面：发货前付 70%，到港后 30 天结清尾款。这样能保持在合理利润区间。需要我更新 PI 吗？`});
      resolveGuard(false); setStatus('ai'); toast('已按 AI 建议发送 · 守住底价 $168','ok');
    },1100);
  };
  const takeover=()=>{ resolveGuard(true); toast('你已接管该会话，AI 退居辅助','info'); };
  const giveBack=()=>{ setMode('ai'); setStatus('ai'); toast('已交还 AI 继续处理','info'); };
  const markDeal=()=>{ setStatus('deal'); setDone(true); setResolved(true);
    append({role:'ai',lang:'EN',time:'09:48',text:`Wonderful — PI confirmed! 🎉 We'll begin production scheduling and keep you posted on the timeline.`,
      zh:`太好了——PI 已确认！🎉 我们将开始排产，并随时同步交期进度。`});
    toast('🎉 已标记为成交，已沉淀成交话术','ok');
  };
  const sendDraft=()=>{ if(!draft.trim())return; append({role:'human',time:'now',text:draft}); setDraft(''); toast('已发送','ok'); };
  const sendEdited=(price)=>{
    setEditOpen(false);
    append({role:'human',lang:'EN',time:'09:37',
      text:`Hi Sanne — I can personally approve $${price}/set CIF Rotterdam at 300 sets, valid 7 days. That's our best given current shipping rates. Let's get this signed!`,
      zh:`Sanne 你好——300 套我可以亲自核准 $${price}/套 CIF 鹿特丹，有效期 7 天。这是当前海运价下我们的最优价，期待签约！`});
    resolveGuard(false); setStatus('human'); setMode('human');
    toast(`已发送人工核准价 $${price}/套`,'ok');
  };

  const statusForBar = done?'deal':status;
  return (
    <div className="col" style={{height:'100%',background:'#fff',minWidth:0}}>
      {/* 顶部操作条 */}
      <div style={{padding:'12px 20px',borderBottom:'1px solid var(--border-2)',flex:'none'}}>
        <div className="row spread" style={{flexWrap:'wrap',gap:10}}>
          <div className="row gap3" style={{minWidth:0}}>
            <Avatar name={inq.contact} size={40}/>
            <div className="col" style={{minWidth:0}}>
              <div className="row gap2">
                <span className="h3 ellipsis">{inq.company}</span>
                <span className="flag">{inq.flag}</span>
                <Grade g={inq.grade} size={20}/>
              </div>
              <div className="row gap2 aux">
                <span>{inq.contact}</span><span>·</span>
                <ChannelIcon ch={inq.channel} size={16}/><span>{CHANNELS[inq.channel].name}</span>
                <span>·</span><span>{inq.country}</span>
              </div>
            </div>
          </div>
          <div className="row gap2">
            <button className="row gap2 clickable" onClick={()=>setTranslate(t=>!t)}
              style={{height:30,padding:'0 10px',borderRadius:7,border:`1px solid ${translate?'var(--primary)':'var(--border)'}`,
                background:translate?'var(--primary-tint)':'#fff',color:translate?'var(--primary)':'var(--text-2)',fontWeight:600,fontSize:12.5}}>
              <Icon name="language" size={15}/>自动翻译
              <span className={`switch ${translate?'on':''}`} style={{width:30,height:17,pointerEvents:'none'}}/>
            </button>
            {!done&&<button className="btn btn-green btn-sm" onClick={markDeal}><Icon name="checkCircle" size={15}/>标记成交</button>}
            {mode==='ai'
              ? <button className="btn btn-sec btn-sm" onClick={takeover}><Icon name="hand" size={15}/>接管</button>
              : <button className="btn btn-sec btn-sm" onClick={giveBack}><Icon name="bot" size={15}/>交还 AI</button>}
            <button className="btn btn-sec btn-sm" onClick={onOpenProfile}><Icon name="user" size={15}/>客户档案</button>
            <button className="btn-icon btn-ghost"><Icon name="more" size={18}/></button>
          </div>
        </div>
        <div className="row gap2" style={{marginTop:10}}>
          <StatusPill status={statusForBar}/>
          {statusForBar==='guardrail'&&!resolved&&<span className="aux" style={{color:'var(--red)'}}>· 自动发送已暂停，等待你的决定</span>}
          {mode==='human'&&statusForBar!=='deal'&&<span className="aux">· 你正在亲自回复，AI 提供草稿建议</span>}
          {statusForBar==='ai'&&<span className="aux">· 平均首响 8 秒 · 全程留痕可审计</span>}
          {translate&&<span className="aux" style={{color:'var(--tech-deep)'}}>· <Icon name="language" size={12} style={{verticalAlign:'-1px'}}/> 外文已自动译为中文，保留原文</span>}
        </div>
      </div>
      {/* 对话流 */}
      <div ref={scrollRef} className="scroll" style={{flex:1,minHeight:0,padding:'20px',background:'#fbfcfd'}}>
        <div className="col" style={{gap:16,maxWidth:760,margin:'0 auto'}}>
          <div className="row center"><span className="aux" style={{background:'#eef1f4',padding:'3px 12px',borderRadius:12}}>今天 · {inq.flag} {inq.country} 时区 09:02</span></div>
          {msgs.map(m=>{
            if(m.role==='screening') return <ScreeningCard key={m.id} m={m}/>;
            if(m.role==='understanding') return <UnderstandCard key={m.id} m={m}/>;
            if(m.role==='quote') return (
              <div key={m.id} className="row anim-up" style={{justifyContent:'flex-end'}}>
                <div style={{maxWidth:'72%'}}>
                  <div className="row gap1" style={{justifyContent:'flex-end',marginBottom:3}}>
                    <span className="badge badge-pri" style={{height:18,fontSize:11}}><Icon name="bot" size={11}/>AI 自动生成</span>
                  </div>
                  <QuoteCard q={QUOTES[m.quote]}/>
                  <div className="aux" style={{textAlign:'right',marginTop:3,fontSize:11}}>{m.time} · 已发送</div>
                </div>
              </div>
            );
            if(m.role==='guardrail') return <GuardrailBanner key={m.id} m={m} resolved={resolved}
              onApproveSuggestion={approveSuggestion} onEditQuote={()=>setEditOpen(true)} onTakeover={takeover}/>;
            return <Bubble key={m.id} m={{...m,who:inq.contact}} translate={translate}/>;
          })}
          {typing&&<Typing/>}
        </div>
      </div>
      {/* 底部输入区 */}
      <div style={{borderTop:'1px solid var(--border-2)',padding:'12px 20px',flex:'none',background:'#fff'}}>
        {mode==='ai'&&!done&&(
          <div className="row gap2" style={{marginBottom:8}}>
            <span className="pill pill-ai" style={{height:24,fontSize:11.5}}><Icon name="bot" size={12}/>AI 自主处理中</span>
            <span className="aux">如需亲自回复，点右上「接管」</span>
          </div>
        )}
        <div className="row gap2" style={{alignItems:'flex-end'}}>
          <button className="btn-icon btn-ghost" disabled={mode==='ai'&&!done}><Icon name="attach" size={18}/></button>
          <textarea className="input" rows={1}
            placeholder={mode==='human'?'输入回复… 客户母语为英文，AI 可帮你润色翻译':'AI 自主回复中 — 点「接管」后可在此输入'}
            value={draft} disabled={mode==='ai'&&!done} onChange={e=>setDraft(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendDraft();}}}
            style={{minHeight:40,maxHeight:120,opacity:(mode==='ai'&&!done)?.5:1}}/>
          {mode==='human'&&<button className="btn btn-sec btn-sm"><Icon name="language" size={14}/>AI 润色</button>}
          <button className="btn btn-pri" onClick={sendDraft} disabled={(mode==='ai'&&!done)||!draft.trim()}>
            <Icon name="send" size={16}/>发送
          </button>
        </div>
      </div>
      <EditQuoteModal open={editOpen} onClose={()=>setEditOpen(false)} q={QUOTES.Q1} onSend={sendEdited}/>
    </div>
  );
}

/* ── 修改报价弹窗 ── */
function EditQuoteModal({open,onClose,q,onSend}){
  const [price,setPrice]=useState(q.floor);
  useEffect(()=>{if(open)setPrice(q.floor);},[open]);
  const below=price<q.floor;
  return (
    <Modal open={open} onClose={onClose} width={420}>
      <div style={{padding:'18px 20px'}}>
        <div className="row spread" style={{marginBottom:4}}>
          <span className="h3">修改报价 · 人工核准</span>
          <button className="btn-icon btn-ghost" onClick={onClose}><Icon name="x" size={18}/></button>
        </div>
        <div className="aux" style={{marginBottom:16}}>{q.product} · 300 套 · CIF 鹿特丹</div>
        <label className="field-label">核准单价（USD / 套）</label>
        <div className="row gap2">
          <input className="input num" type="number" value={price} onChange={e=>setPrice(+e.target.value)}
            style={{fontSize:18,fontWeight:600,borderColor:below?'var(--red)':'var(--border)'}}/>
          <span className="aux" style={{whiteSpace:'nowrap'}}>底价红线 {fmtMoney(q.floor)}</span>
        </div>
        {below
          ? <div className="row gap2" style={{marginTop:10,padding:'9px 12px',background:'var(--red-light)',borderRadius:8}}>
              <Icon name="alert" size={15} style={{color:'var(--red)'}}/><span className="aux" style={{color:'#b53d39',fontWeight:600}}>低于底价 {fmtMoney(q.floor)}，不可发送（需更高权限审批）</span></div>
          : <div className="row gap2" style={{marginTop:10,padding:'9px 12px',background:'var(--green-light)',borderRadius:8}}>
              <Icon name="check" size={15} style={{color:'var(--green)'}}/><span className="aux" style={{color:'#1f7568',fontWeight:600}}>在底价之上，毛利约 {Math.round((price-149)/price*100)}% · 可发送</span></div>}
        <div className="row gap2" style={{marginTop:18,justifyContent:'flex-end'}}>
          <button className="btn btn-sec btn-sm" onClick={onClose}>取消</button>
          <button className="btn btn-pri btn-sm" disabled={below} onClick={()=>onSend(price)}><Icon name="send" size={14}/>核准并发送</button>
        </div>
      </div>
    </Modal>
  );
}

/* ══════════════════════════════════════════
   桶 1：收件箱
══════════════════════════════════════════ */
function InboxList({active, onPick, filter, setFilter, q, setQ}){
  const filters=[['all','全部'],['A','A 级'],['guardrail','待处理'],['ai','AI 中'],['deal','已成交']];
  let list=INQUIRIES.filter(i=>{
    if(filter==='A') return i.grade==='A';
    if(filter==='guardrail') return i.status==='guardrail'||i.status==='human';
    if(filter==='ai') return i.status==='ai'||i.status==='followup';
    if(filter==='deal') return i.status==='deal';
    return true;
  });
  if(q) list=list.filter(i=>(i.company+i.title+i.contact).toLowerCase().includes(q.toLowerCase()));
  return (
    <div className="col" style={{width:340,borderRight:'1px solid var(--border-2)',background:'#fff',flex:'none',height:'100%'}}>
      <div style={{padding:'14px 16px 10px',flex:'none'}}>
        <div style={{position:'relative',marginBottom:10}}>
          <span style={{position:'absolute',left:10,top:9,color:'var(--text-3)'}}><Icon name="search" size={16}/></span>
          <input className="input" placeholder="搜索客户 / 公司 / 关键词" value={q} onChange={e=>setQ(e.target.value)} style={{paddingLeft:32,height:34}}/>
        </div>
        <div className="row gap1" style={{flexWrap:'wrap'}}>
          {filters.map(([k,l])=>(
            <button key={k} onClick={()=>setFilter(k)} className="badge clickable"
              style={{height:26,padding:'0 11px',background:filter===k?'var(--primary)':'#f1f4f7',
                color:filter===k?'#fff':'var(--text-2)',fontWeight:600}}>{l}</button>
          ))}
        </div>
      </div>
      <div className="scroll" style={{flex:1}}>
        {list.map(i=><InboxRow key={i.id} i={i} active={i.id===active} onClick={()=>onPick(i)}/>)}
        {list.length===0&&<Empty icon="search" title="没有匹配的询盘" desc="试试换个筛选或关键词"/>}
      </div>
    </div>
  );
}

function InboxRow({i, active, onClick}){
  const m=STATUS_META[i.status];
  return (
    <div onClick={onClick} className="clickable" style={{padding:'12px 16px',borderBottom:'1px solid var(--border-2)',
      background:active?'var(--primary-tint)':'#fff',
      borderLeft:active?'3px solid var(--primary)':'3px solid transparent',transition:'background .12s'}}>
      <div className="row spread" style={{marginBottom:4}}>
        <div className="row gap2" style={{minWidth:0}}>
          <Grade g={i.grade} size={18}/>
          <span className="flag">{i.flag}</span>
          <span style={{fontWeight:600,fontSize:13.5}} className="ellipsis">{i.company}</span>
          {i.pinned&&<Icon name="pin" size={12} style={{color:'var(--primary)',flex:'none'}}/>}
        </div>
        <div className="row gap2" style={{flex:'none',alignItems:'center'}}>
          <ChannelIcon ch={i.channel} size={13}/>
          <span className="aux" style={{fontSize:11}}>{i.time}</span>
        </div>
      </div>
      <div className="aux ellipsis" style={{marginBottom:6,color:'var(--text)'}}>{i.title}</div>
      <div className="aux ellipsis" style={{marginBottom:8,fontSize:12}}>{i.snippet}</div>
      <div className="row spread">
        <span className={`pill ${m.pill}`} style={{height:21,fontSize:11,padding:'0 7px'}}>
          <Icon name={m.icon} size={11}/>{m.label}
        </span>
        {i.value>0&&<span className="num aux" style={{fontWeight:600,color:'var(--text-2)'}}>{fmtMoney(i.value)}</span>}
        {i.unread&&<span className="dot" style={{background:'var(--red)',width:7,height:7}}/>}
      </div>
    </div>
  );
}

function InboxBucket({onOpenProfile}){
  const [active,setActive]=useState(INQUIRIES[0]);
  const [filter,setFilter]=useState('all');
  const [q,setQ]=useState('');
  return (
    <div className="row" style={{flex:1,minHeight:0,overflow:'hidden'}}>
      <InboxList active={active.id} onPick={setActive} filter={filter} setFilter={setFilter} q={q} setQ={setQ}/>
      <ConversationView inq={active} onOpenProfile={()=>onOpenProfile(active)}/>
    </div>
  );
}

/* ══════════════════════════════════════════
   桶 2：待确认
══════════════════════════════════════════ */
function ConfidencePill({score}){
  const color = score>=80?'var(--green)':score>=60?'#CA8A04':'var(--text-3)';
  const bg    = score>=80?'rgba(43,166,138,.1)':score>=60?'rgba(202,138,4,.1)':'var(--bg-2,#f4f5f8)';
  return (
    <span style={{fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:6,color,background:bg,flex:'none'}}>
      {score}% 置信
    </span>
  );
}

function PendingItem({item, onConfirm, onArchive, onAssign, selected, onSelect}){
  const toast=useToast();
  const [expanded,setExpanded]=useState(false);
  return (
    <div className="card anim-up" style={{marginBottom:10,border:'1px solid var(--border)',padding:0,overflow:'hidden'}}>
      {/* 主行 */}
      <div style={{padding:'14px 16px',cursor:'pointer'}} onClick={()=>setExpanded(e=>!e)}>
        <div className="row gap3" style={{alignItems:'flex-start'}}>
          <input type="checkbox" checked={selected} onClick={e=>e.stopPropagation()} onChange={onSelect}
            style={{marginTop:3,flex:'none',accentColor:'var(--primary)'}}/>
          <div style={{flex:1,minWidth:0}}>
            <div className="row spread" style={{marginBottom:4}}>
              <div className="row gap2" style={{minWidth:0,flexWrap:'wrap'}}>
                <span style={{fontWeight:700,fontSize:13.5}}>{item.from}</span>
                <span className="flag">{item.flag}</span>
                <ConfidencePill score={item.triage.confidence}/>
                <span style={{fontSize:11,padding:'2px 7px',borderRadius:5,background:'var(--primary-tint)',color:'var(--primary)',fontWeight:600}}>
                  {item.triage.category}
                </span>
              </div>
              <div className="row gap2" style={{flex:'none'}}>
                <span className="aux" style={{fontSize:11}}>{item.time}</span>
                <Icon name={expanded?'chevD':'chevR'} size={15} style={{color:'var(--text-3)'}}/>
              </div>
            </div>
            <div style={{fontWeight:600,fontSize:13,marginBottom:3,color:'var(--text)'}}>{item.subject}</div>
            <div className="aux ellipsis" style={{fontSize:12}}>{item.snippet}</div>
          </div>
        </div>
      </div>

      {/* 展开：AI 判断详情 */}
      {expanded&&(
        <div style={{padding:'0 16px 14px 44px',borderTop:'1px solid var(--border-2)',paddingTop:12}}>
          {/* 信号列表 */}
          <div className="col" style={{gap:5,marginBottom:12}}>
            <div style={{fontSize:11.5,fontWeight:700,color:'var(--text-3)',marginBottom:2}}>AI 判断信号</div>
            {item.triage.signals.map((s,i)=>(
              <div key={i} className="row gap2" style={{alignItems:'flex-start'}}>
                <Icon name={s.ok?'check':'x'} size={13} style={{color:s.ok?'var(--green)':'var(--red)',flex:'none',marginTop:1}}/>
                <span style={{fontSize:12.5,color:'var(--text-2)'}}>{s.label}</span>
              </div>
            ))}
          </div>

function PendingBucket(){
  const toast=useToast();
  const [items,setItems]=useState(TRIAGE_PENDING);
  const [selected,setSelected]=useState(new Set());

  const remove=(id)=>setItems(s=>s.filter(i=>i.id!==id));
  const toggleSel=(id)=>setSelected(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  const selAll=()=>setSelected(items.length===selected.size?new Set():new Set(items.map(i=>i.id)));
  const batchConfirm=()=>{ setItems(s=>s.filter(i=>!selected.has(i.id))); setSelected(new Set()); toast(`已批量确认 ${selected.size} 条为询盘`,'ok'); };
  const batchArchive=()=>{ setItems(s=>s.filter(i=>!selected.has(i.id))); setSelected(new Set()); toast(`已批量归档 ${selected.size} 条`,'info'); };

  return (
    <div className="col" style={{flex:1,minHeight:0,overflow:'hidden'}}>
      {/* 顶部操作栏 */}
      <div style={{padding:'14px 24px',borderBottom:'1px solid var(--border-2)',flex:'none',background:'#fff'}}>
        <div className="row spread" style={{alignItems:'center'}}>
          <div className="row gap3">
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <input type="checkbox" checked={items.length>0&&selected.size===items.length}
                onChange={selAll} style={{accentColor:'var(--primary)'}}/>
              <span style={{fontSize:13,color:'var(--text-2)'}}>全选</span>
            </div>
            {selected.size>0&&(
              <div className="row gap2">
                <span style={{fontSize:12.5,color:'var(--text-3)'}}>已选 {selected.size} 条</span>
                <button className="btn btn-sm btn-pri" onClick={batchConfirm}><Icon name="check" size={12}/>批量确认</button>
                <button className="btn btn-sm btn-sec" onClick={batchArchive}><Icon name="inbox" size={12}/>批量归档</button>
              </div>
            )}
          </div>
          <div style={{fontSize:12.5,color:'var(--text-3)'}}>
            <Icon name="bot" size={13} style={{verticalAlign:'-2px',marginRight:4,color:'var(--primary)'}}/>
            AI 分诊拿不准时进此桶，人工一键判定
          </div>
        </div>
      </div>

      {/* 条目列表 */}
      <div className="scroll" style={{flex:1,padding:'20px 24px'}}>
        {items.length===0?(
          <Empty icon="check" title="待确认队列已清空" desc="所有入站都已判定完毕，你做到了！"/>
        ):(
          items.map(item=>(
            <PendingItem key={item.id} item={item} selected={selected.has(item.id)}
              onSelect={()=>toggleSel(item.id)}
              onConfirm={remove} onArchive={remove} onAssign={remove}/>
          ))
        )}
      </div>
    </div>
  );
}

/* 趋势图（SVG 柱 + 折线） */
function TrendChart(){
  const w=380,h=150,pad=24;
  const max=Math.max(...TREND.map(t=>t.inq));
  const bw=(w-pad*2)/TREND.length;
  const x=i=>pad+bw*i+bw/2;
  const y=v=>h-pad-(v/max)*(h-pad*2);
  const line=TREND.map((t,i)=>`${x(i)},${y(t.deal)}`).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{width:'100%',height:160}}>
      {[0,.5,1].map(f=><line key={f} x1={pad} x2={w-pad} y1={pad+(h-pad*2)*f} y2={pad+(h-pad*2)*f} stroke="var(--border-2)" strokeWidth="1"/>)}
      {TREND.map((t,i)=>(
        <rect key={i} x={x(i)-13} y={y(t.inq)} width="26" height={h-pad-y(t.inq)} rx="4" fill="var(--primary-light)"/>
      ))}
      <polyline points={line} fill="none" stroke="var(--green)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {TREND.map((t,i)=><circle key={i} cx={x(i)} cy={y(t.deal)} r="3.5" fill="#fff" stroke="var(--green)" strokeWidth="2"/>)}
      {TREND.map((t,i)=><text key={i} x={x(i)} y={h-7} textAnchor="middle" fontSize="10" fill="var(--text-3)">{t.d}</text>)}
    </svg>
  );
}

/* ── 邮件接入向导 ── */
function EmailWizard({onClose, onSave}){
  const toast = useToast();
  const [step, setStep]         = useState(1);
  const [method, setMethod]     = useState('imap');
  const [provider, setProvider] = useState('gmail');
  const [testState, setTest]    = useState(null);
  const [form, setForm]         = useState({
    email:'', password:'', from_name:'',
    imap_host:'imap.gmail.com', imap_port:'993',
    smtp_host:'smtp.gmail.com', smtp_port:'465',
    mailbox:'INBOX', start_date:'',
  });

  const pv  = EMAIL_PROVIDERS.find(p=>p.key===provider)||EMAIL_PROVIDERS[0];
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const applyProvider = (pk) => {
    setProvider(pk);
    const p = EMAIL_PROVIDERS.find(x=>x.key===pk);
    if(p && pk!=='custom') setForm(f=>({...f,
      imap_host:p.imap, imap_port:String(p.port_i),
      smtp_host:p.smtp, smtp_port:String(p.port_s),
    }));
  };

  const runTest = () => {
    if(!form.email||!form.password){ toast('请先填写邮箱和授权码','warn'); return; }
    setTest('running');
    setTimeout(()=>{ setTest('ok'); toast('连接测试通过','info'); }, 2000);
  };

  const steps = ['连接方式','服务商','账号配置','连接测试','收取设置'];
  const canNext = () => {
    if(step===2 && !provider) return false;
    if(step===3 && (!form.email||!form.password)) return false;
    if(step===4 && testState!=='ok') return false;
    return true;
  };

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* 步骤指示 */}
      <div style={{padding:'16px 20px 0',borderBottom:'1px solid var(--border-2)'}}>
        <div className="row gap1" style={{gap:0}}>
          {steps.map((s,i)=>{
            const idx=i+1; const done=idx<step; const active=idx===step;
            return (
              <React.Fragment key={s}>
                <div className="col" style={{alignItems:'center',flex:1}}>
                  <div style={{width:24,height:24,borderRadius:'50%',
                    background:done?'var(--green)':active?'var(--primary)':'var(--border)',
                    color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',
                    fontSize:11,fontWeight:700,marginBottom:4}}>
                    {done?<Icon name="check" size={12}/>:idx}
                  </div>
                  <span style={{fontSize:10.5,color:active?'var(--primary)':done?'var(--green)':'var(--text-3)',
                    fontWeight:active||done?600:400,whiteSpace:'nowrap'}}>{s}</span>
                </div>
                {i<steps.length-1&&<div style={{height:1,flex:0.6,background:'var(--border-2)',marginTop:11,alignSelf:'flex-start'}}/>}
              </React.Fragment>
            );
          })}
        </div>
        <div style={{height:14}}/>
      </div>

      {/* 内容区 */}
      <div style={{flex:1,overflowY:'auto',padding:'20px 20px 0'}}>

        {/* Step 1: 连接方式 */}
        {step===1&&(
          <div className="col" style={{gap:12}}>
            <p className="muted" style={{fontSize:13,marginBottom:4}}>推荐使用 OAuth——无需授权码，自动处理 2FA，连接更稳定。</p>
            {[
              {key:'oauth',label:'OAuth 授权（推荐）',sub:'Gmail / Outlook 一键授权，无需手填密码',badge:'推荐',badgeColor:'var(--green)'},
              {key:'imap', label:'IMAP / SMTP + 授权码',sub:'支持任意邮箱，Gmail/Outlook 需先生成应用专用密码'},
            ].map(m=>(
              <button key={m.key} onClick={()=>setMethod(m.key)}
                style={{padding:'14px 16px',borderRadius:10,textAlign:'left',width:'100%',cursor:'pointer',
                  border:`1.5px solid ${method===m.key?'var(--primary)':'var(--border)'}`,
                  background:method===m.key?'var(--primary-tint)':'var(--surface)'}}>
                <div className="row spread">
                  <span style={{fontWeight:600,fontSize:13.5,color:'var(--text)'}}>{m.label}
                    {m.badge&&<span style={{marginLeft:8,fontSize:10.5,fontWeight:600,padding:'1px 7px',borderRadius:4,
                      background:m.badgeColor+'22',color:m.badgeColor}}>{m.badge}</span>}
                  </span>
                  <div style={{width:18,height:18,borderRadius:'50%',border:`2px solid ${method===m.key?'var(--primary)':'var(--border)'}`,
                    display:'flex',alignItems:'center',justifyContent:'center',flex:'none'}}>
                    {method===m.key&&<div style={{width:8,height:8,borderRadius:'50%',background:'var(--primary)'}}/>}

        {/* Step 2: 服务商 */}
        {step===2&&(
          <div className="col" style={{gap:8}}>
            <p className="muted" style={{fontSize:13,marginBottom:4}}>选择后自动填写服务器信息，只需输入邮箱和授权码。</p>

              <label style={{fontSize:12.5,fontWeight:600,color:'var(--text-2)'}}>发件人显示名</label>

              </label>
              <input className="input" type="password" placeholder="非登录密码，需单独生成" value={form.password} onChange={e=>set('password',e.target.value)}/>

              )}

            {provider==='custom'&&(

                <div style={{fontSize:12.5,fontWeight:600,color:'var(--text-2)',marginBottom:10}}>自定义服务器</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 80px',gap:8,marginBottom:8}}>
                  <input className="input" placeholder="IMAP 服务器" value={form.imap_host} onChange={e=>set('imap_host',e.target.value)}/>
                  <input className="input" placeholder="端口" value={form.imap_port} onChange={e=>set('imap_port',e.target.value)}/>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 80px',gap:8}}>
                  <input className="input" placeholder="SMTP 服务器" value={form.smtp_host} onChange={e=>set('smtp_host',e.target.value)}/>
                  <input className="input" placeholder="端口" value={form.smtp_port} onChange={e=>set('smtp_port',e.target.value)}/>
                </div>
              </div>
            )}
            {provider!=='custom'&&(
              <div style={{padding:'10px 12px',borderRadius:9,background:'var(--bg-2,#f4f5f8)',fontSize:12,color:'var(--text-3)'}}>
                IMAP: <b style={{color:'var(--text-2)'}}>{pv.imap}:{pv.port_i}</b> · SMTP: <b style={{color:'var(--text-2)'}}>{pv.smtp}:{pv.port_s}</b>
              </div>
            )}
          </div>
        )}

        {/* Step 4: 连接测试 */}
        {step===4&&(
          <div className="col" style={{gap:16}}>
            <p className="muted" style={{fontSize:13}}>保存前需通过双向连接测试（收信 + 发信）。</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              {[{label:'IMAP 收信',sub:'验证能否读取邮件'},{label:'SMTP 发信',sub:'向自己发送测试邮件'}].map((t)=>(
                <div key={t.label} style={{padding:'16px',borderRadius:10,
                  border:`1.5px solid ${testState==='ok'?'rgba(43,166,138,.4)':testState==='fail'?'rgba(224,82,82,.3)':'var(--border)'}`,
                  background:testState==='ok'?'rgba(43,166,138,.04)':testState==='fail'?'rgba(224,82,82,.03)':'var(--surface)'}}>
                  <div style={{fontWeight:600,fontSize:13.5,marginBottom:4}}>{t.label}</div>
                  <div style={{fontSize:12,color:'var(--text-3)',marginBottom:10}}>{t.sub}</div>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    {testState===null&&<span style={{fontSize:12,color:'var(--text-3)'}}>待测试</span>}
                    {testState==='running'&&<span style={{fontSize:12,color:'var(--text-3)'}}>测试中…</span>}
                    {testState==='ok'&&<><Icon name="check" size={14} style={{color:'var(--green)'}}/><span style={{fontSize:12,color:'var(--green)',fontWeight:600}}>通过</span></>}
                    {testState==='fail'&&<span style={{fontSize:12,color:'var(--red)',fontWeight:600}}>失败</span>}
                  </div>
                </div>
              ))}
            </div>
            <button className="btn btn-pri" onClick={runTest} disabled={testState==='running'||testState==='ok'}
              style={{alignSelf:'flex-start'}}>
              {testState==='running'?'测试中…':testState==='ok'?'✓ 测试通过':'开始测试'}
            </button>
            {testState==='fail'&&(
              <div style={{padding:'12px 14px',borderRadius:9,background:'rgba(224,82,82,.06)',border:'1px solid rgba(224,82,82,.2)',fontSize:12.5,color:'var(--red)'}}>
                认证失败 · 请确认：① 是否已开启 IMAP 服务 ② 使用的是授权码（非登录密码）
              </div>
            )}
          </div>
        )}

        {/* Step 5: 收取设置 */}
        {step===5&&(
          <div className="col" style={{gap:16}}>
            <div className="col" style={{gap:5}}>
              <label style={{fontSize:12.5,fontWeight:600,color:'var(--text-2)'}}>收取文件夹</label>
              <input className="input" placeholder="INBOX" value={form.mailbox} onChange={e=>set('mailbox',e.target.value)}/>
              <span style={{fontSize:11.5,color:'var(--text-3)'}}>多数情况保持 INBOX；如有专用询盘文件夹可单独指定</span>
            </div>
            <div className="col" style={{gap:5}}>
              <label style={{fontSize:12.5,fontWeight:600,color:'var(--text-2)'}}>起始收取日期 <span style={{fontWeight:400,color:'var(--text-3)'}}>（防止吞入历史邮件）</span></label>
              <input className="input" type="date" value={form.start_date} onChange={e=>set('start_date',e.target.value)}/>
              <span style={{fontSize:11.5,color:'var(--text-3)'}}>留空则从今日起收取，不导入历史记录</span>
            </div>
            <div style={{padding:'12px 14px',borderRadius:9,background:'rgba(202,138,4,.07)',border:'1px solid rgba(202,138,4,.2)'}}>
              <span style={{fontSize:12.5,color:'#92650a',fontWeight:500}}>📋 SPF/DKIM/DMARC 提示：从自有域名发信时建议在 DNS 配置 SPF 和 DKIM，以提升投递率和避免进垃圾箱。</span>
            </div>
          </div>
        )}
      </div>

      {/* 底部操作 */}
      <div className="row spread" style={{padding:'16px 20px',borderTop:'1px solid var(--border-2)',marginTop:16,flexShrink:0}}>
        <button className="btn btn-sec" onClick={step===1?onClose:()=>setStep(s=>s-1)}>
          {step===1?'取消':'← 上一步'}
        </button>
        <div className="row gap2">
          <span style={{fontSize:12,color:'var(--text-3)'}}>{step} / {steps.length}</span>
          {step<steps.length
            ? <button className="btn btn-pri" onClick={()=>setStep(s=>s+1)} disabled={!canNext()}>下一步 →</button>
            : <button className="btn btn-pri" onClick={()=>{ onSave(); toast('邮箱接入已配置，开始同步','info'); onClose(); }}>完成接入</button>
          }
        </div>
      </div>
    </div>
  );
}

  return (

            <span className="aux" style={{maxWidth:274,lineHeight:1.5}}>切换底部标签，点「待处理 / 提醒 / 询盘」任意一条进入会话，试试护栏页的<b style={{color:'var(--text)'}}>「采纳建议并发送」</b>。</span>
          </div>

          {/* 原型板 */}
          <div className="col" style={{gap:16,flex:1,minWidth:560}}>
            <span className="eyebrow" style={{color:'var(--text-3)'}}>全部界面 · 原型图</span>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(248px,1fr))',gap:'28px 20px',justifyItems:'center'}}>
              <div style={{pointerEvents:'none'}}><PhoneShell w={248} h={520} nav activeTab="home" label="工作台"><MHome/></PhoneShell></div>
              <div style={{pointerEvents:'none'}}><PhoneShell w={248} h={520} nav activeTab="inbox" label="询盘收件箱"><MInbox/></PhoneShell></div>
              <div style={{pointerEvents:'none'}}><PhoneShell w={248} h={520} label="会话 · 护栏接管"><MConvo/></PhoneShell></div>
              <div style={{pointerEvents:'none'}}><PhoneShell w={248} h={520} nav activeTab="alerts" label="转人工提醒"><MAlerts/></PhoneShell></div>
              <div style={{pointerEvents:'none'}}><PhoneShell w={248} h={520} label="客户档案"><MCustomer/></PhoneShell></div>
              <div style={{pointerEvents:'none'}}><PhoneShell w={248} h={520} nav activeTab="me" label="我的 · 设置"><MMe/></PhoneShell></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, {MobilePreview});

</script>
<script type="text/babel">
/* ===== theme.jsx ===== */
/* ============ 风格切换器（5 套主题，实时切换 + 记忆）============ */
const THEMES = [
  {key:'aurora',   name:'极光蓝',  desc:'浅色侧栏 · 墨蓝 + 电蓝', dot:'#1F5C8C', dot2:'#5BB8E8', side:'#F3F6F9'},
  {key:'midnight', name:'深空',    desc:'暗色侧栏 · 电蓝高光',   dot:'#1F5C8C', dot2:'#48A8E8', side:'#16252F'},
  {key:'graphite', name:'石墨',    desc:'极简单色 · 通透留白',   dot:'#3A4757', dot2:'#8FA8C2', side:'#F0F2F4'},
  {key:'sand',     name:'暖砂',    desc:'暖纸质感 · 青石 + 铜金', dot:'#42566E', dot2:'#C9A669', side:'#F0EBE2'},
  {key:'indigo',   name:'靛紫',    desc:'科技感 · 靛蓝 + 紫晕',   dot:'#4C4FB8', dot2:'#9A8DF5', side:'#F1F1F9'},
];

function applyTheme(key){
  document.documentElement.setAttribute('data-theme', key);
  try{ localStorage.setItem('closer-theme', key); }catch(e){}
}

function ThemeSwitcher({placement='floating'}){
  const [open,setOpen]=useState(false);
  const [theme,setTheme]=useState(()=>{
    try{ return localStorage.getItem('closer-theme')||'indigo'; }catch(e){ return 'indigo'; }
  });
  const [dropPos,setDropPos]=useState({top:0,right:0});
  const btnRef=React.useRef(null);
  useEffect(()=>{ applyTheme(theme); },[theme]);
  const isTopbar = placement === 'topbar';

  const handleToggle=()=>{
    if(!open && isTopbar && btnRef.current){
      const r=btnRef.current.getBoundingClientRect();
      setDropPos({top:r.bottom+8, right:window.innerWidth-r.right});
    }
    setOpen(o=>!o);
  };

  const dropdownContent = open && (
    <div className="card anim-up" style={{
      position:'fixed',
      top: isTopbar ? dropPos.top : undefined,
      right: isTopbar ? dropPos.right : 20,
      bottom: isTopbar ? undefined : 74,
      zIndex: 9999,
      width:268,
      padding:'12px',
      boxShadow:'var(--shadow-lg)'
    }}>
      <div className="row spread" style={{padding:'2px 4px 10px'}}>
        <span className="row gap2" style={{alignItems:'center'}}><Icon name="sliders" size={15} style={{color:'var(--primary)'}}/><span style={{fontWeight:700,fontSize:13}}>选择风格</span></span>
        <span className="aux" style={{fontSize:11}}>即时预览</span>
      </div>
      <div className="col" style={{gap:6}}>
        {THEMES.map(t=>(
          <button key={t.key} onClick={()=>setTheme(t.key)} className="row spread clickable"
            style={{padding:'9px 11px',borderRadius:10,border:`1px solid ${theme===t.key?'var(--primary)':'var(--border-2)'}`,
              background:theme===t.key?'var(--primary-tint)':'#fff',transition:'border-color .14s,background .14s'}}>
            <span className="row gap3" style={{alignItems:'center'}}>
              {/* 迷你皮肤预览 */}
              <span style={{width:34,height:26,borderRadius:6,overflow:'hidden',display:'flex',flex:'none',border:'1px solid var(--border-2)'}}>
                <span style={{width:11,background:t.side}}></span>
                <span style={{flex:1,background:'#fff',display:'flex',alignItems:'flex-end',padding:2,gap:2}}>
                  <span style={{width:8,height:8,borderRadius:2,background:t.dot}}></span>
                  <span style={{width:6,height:6,borderRadius:2,background:t.dot2}}></span>
                </span>
              </span>
              <span className="col" style={{alignItems:'flex-start',gap:1}}>
                <span style={{fontWeight:600,fontSize:13}}>{t.name}</span>
                <span className="aux" style={{fontSize:10.5}}>{t.desc}</span>
              </span>
            </span>
            {theme===t.key&&<Icon name="check" size={15} style={{color:'var(--primary)',flex:'none'}}/>}
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <div style={isTopbar ? {position:'relative'} : {position:'fixed',right:20,bottom:20,zIndex:400}}>
      {ReactDOM.createPortal(dropdownContent, document.body)}
      <button ref={btnRef} onClick={handleToggle} className="row gap2"
        title="选择风格"
        style={{
          height:isTopbar?36:44,
          width:isTopbar?36:undefined,
          justifyContent:'center',
          padding:isTopbar?0:'0 16px 0 14px',
          borderRadius:isTopbar?9:24,
          background:isTopbar?'#fff':'var(--hero-grad)',
          color:isTopbar?'var(--text)':'#fff',
          fontWeight:600,
          fontSize:isTopbar?13:13.5,
          boxShadow:isTopbar?'none':'var(--shadow-lg)',
          border:isTopbar?'1px solid var(--border)':'1px solid rgba(255,255,255,.14)'
        }}>
        <Icon name={open?'x':'palette'} size={17}/>{!isTopbar&&(open?'收起':'风格')}
      </button>
    </div>
  );
}

Object.assign(window, {ThemeSwitcher});

</script>
<script type="text/babel">
/* ===== app.jsx ===== */
/* ============ 应用外壳 + 路由 ============ */

function Logo({size=30, color, compact=false}){
  return (
    <div className="row gap2" style={{alignItems:'center'}}>
      <span style={{width:size,height:size,borderRadius:10,display:'inline-flex',alignItems:'center',justifyContent:'center',flex:'none',
        background:'radial-gradient(circle at 30% 22%,rgba(255,255,255,.34),transparent 34%),linear-gradient(145deg,var(--tech-2),var(--primary) 62%,var(--tech-deep))',
        boxShadow:'0 8px 20px -10px color-mix(in srgb,var(--primary) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.30)'}}>
        <svg width={size*.64} height={size*.64} viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M16.9 6.1A7.2 7.2 0 1 0 17 17.8" stroke="#fff" strokeWidth="2.45" strokeLinecap="round"/>
          <path d="M10 12h10" stroke="#fff" strokeWidth="2.45" strokeLinecap="round"/>
          <path d="M17 9l3 3-3 3" stroke="#fff" strokeWidth="2.45" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </span>
      {!compact&&<span style={{fontWeight:800,fontSize:size*.58,letterSpacing:'-.035em',color:color||'var(--text)'}}>Closer</span>}
    </div>
  );
}

const NAV=[
  {key:'dashboard', icon:'dashboard', label:'工作台'},
  {key:'inbox', icon:'inbox', label:'智能询盘', badge:2},
  {key:'quoterules', icon:'rules', label:'智能报价'},
  {key:'crm', icon:'users', label:'客户档案'},
  {key:'products', icon:'box', label:'产品库'},
  {key:'settings', icon:'globe', label:'渠道接入'},
];

function Sidebar({route, go, onWizard, collapsed}){
  return (
    <div className="sidebar">
      <div style={{padding:collapsed?'18px 16px 16px':'20px 20px 18px',display:'flex',justifyContent:collapsed?'center':'flex-start'}}><Logo color="var(--side-text-strong)" compact={collapsed}/></div>
      <div style={{padding:collapsed?'0 10px':'0 13px',flex:1,overflowY:'auto'}}>
        {NAV.map(n=>(
          <button key={n.key} onClick={()=>go(n.key)} className={`navlink ${route===n.key?'active':''}`} title={collapsed?n.label:undefined}
            style={collapsed?{height:42,justifyContent:'center',padding:'0',marginBottom:5}:undefined}>
            <span className="row gap2" style={collapsed?{justifyContent:'center'}:undefined}><Icon name={n.icon} size={18} strokeWidth={route===n.key?2:1.7}/>{!collapsed&&n.label}</span>
            {n.badge&&(!collapsed?<span className="badge" style={{height:18,minWidth:18,padding:'0 5px',justifyContent:'center',background:'var(--red)',color:'#fff'}}>{n.badge}</span>:<span style={{position:'absolute',right:8,top:8,width:7,height:7,borderRadius:'50%',background:'var(--red)',border:'1px solid var(--side-bg-1)'}}></span>)}
          </button>
        ))}
      </div>

      <div style={{padding:collapsed?'10px':'0 13px 12px'}}>
        <button onClick={()=>go('sysconfig')} className={`navlink ${route==='sysconfig'?'active':''}`} title={collapsed?'系统设置':undefined}
          style={collapsed?{height:42,justifyContent:'center',padding:'0',marginBottom:0}:undefined}>
          <span className="row gap2" style={collapsed?{justifyContent:'center'}:undefined}><Icon name="settings" size={18} strokeWidth={route==='sysconfig'?2:1.7}/>{!collapsed&&'系统设置'}</span>
        </button>
      </div>
    </div>
  );
}

function CurrentTime(){
  const [now,setNow]=useState(()=>new Date());
  useEffect(()=>{
    const id=setInterval(()=>setNow(new Date()),1000);
    return ()=>clearInterval(id);
  },[]);
  const time=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const dateStr=now.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',weekday:'short'});
  const tzName=Intl.DateTimeFormat().resolvedOptions().timeZone||'Local';
  return (
    <span className="mono" style={{fontSize:13.5,fontWeight:600,color:'var(--text)'}}>
      {time}
      <span style={{color:'var(--text-3)',fontWeight:400,fontSize:12}}>{' '}{dateStr} · {tzName}</span>
    </span>
  );
}

function LanguageSelect(){
  const [lang,setLang]=useState('zh');
  return (
    <div className="btn-icon btn-sec" style={{position:'relative',overflow:'hidden'}} title={lang==='zh'?'语言：中文':'语言'}>
      <Icon name="globe" size={18}/>
      <select value={lang} onChange={(e)=>setLang(e.target.value)} title="语言"
        aria-label="语言"
        style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:0,border:0,outline:0,cursor:'pointer'}}>
        <option value="zh">中文</option>
        <option value="en" disabled>English（暂未实现）</option>
      </select>
    </div>
  );
}

function UserMenu(){
  const [open,setOpen]=useState(false);
  const [pos,setPos]=useState({top:0,right:0});
  const btnRef=React.useRef(null);

  const handleToggle=()=>{
    if(!open && btnRef.current){
      const r=btnRef.current.getBoundingClientRect();
      setPos({top:r.bottom+8, right:window.innerWidth-r.right});
    }
    setOpen(o=>!o);
  };

  useEffect(()=>{
    if(!open) return;
    const close=(e)=>{ if(!e.target.closest('[data-user-menu]')) setOpen(false); };
    document.addEventListener('mousedown',close);
    return ()=>document.removeEventListener('mousedown',close);
  },[open]);

  const MENU_ITEMS=[
    {icon:'user',    label:'账户设置',  desc:'个人信息与偏好'},
    {icon:'bell',    label:'通知与提醒', desc:'消息推送与提醒规则'},
    {icon:'shield',  label:'安全设置',  desc:'密码与登录保护'},
    null,
    {icon:'help',    label:'帮助中心',  desc:'使用文档与教程'},
    {icon:'message', label:'提交反馈',  desc:'帮助我们改进产品'},
    null,
    {icon:'logout',  label:'退出登录',  danger:true},
  ];

  const dropdown = open && ReactDOM.createPortal(
    <div data-user-menu className="card anim-up" style={{
      position:'fixed', top:pos.top, right:pos.right,
      width:260, padding:'8px', zIndex:9999,
      boxShadow:'var(--shadow-lg)'
    }}>
      {/* 用户信息头 */}
      <div style={{padding:'10px 12px 12px',borderBottom:'1px solid var(--border-2)',marginBottom:6}}>
        <div className="row gap2" style={{alignItems:'center'}}>
          <span style={{width:38,height:38,borderRadius:'50%',flex:'none',
            background:'linear-gradient(145deg,var(--tech-2,#5BB8E8),var(--primary))',
            color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',
            fontWeight:700,fontSize:15,boxShadow:'inset 0 1px 0 rgba(255,255,255,.22)'}}>
            {SELLER.initials}
          </span>
          <div className="col" style={{minWidth:0,gap:1}}>
            <span style={{fontWeight:600,fontSize:13,color:'var(--text)'}} className="ellipsis">{SELLER.name}</span>
            <span style={{fontSize:11,color:'var(--text-3)'}} className="ellipsis">{SELLER.company}</span>
          </div>
          <span style={{fontSize:10,fontWeight:600,padding:'2px 7px',borderRadius:5,
            background:'var(--primary-tint,rgba(79,99,187,.1))',color:'var(--primary)',
            whiteSpace:'nowrap',flex:'none'}}>
            {SELLER.plan}
          </span>
        </div>
      </div>
      {/* 菜单项 */}
      {MENU_ITEMS.map((item,i)=>
        item===null
          ? <div key={i} style={{height:1,background:'var(--border-2)',margin:'4px 0'}}/>
          : <button key={item.label} className="row gap2 clickable" onClick={()=>setOpen(false)}
              style={{width:'100%',padding:'8px 12px',borderRadius:8,textAlign:'left',
                color:item.danger?'var(--red)':'var(--text)',
                background:'transparent',border:'none',cursor:'pointer',alignItems:'center'}}>
              <span style={{color:item.danger?'var(--red)':'var(--text-3)',flex:'none'}}>
                <Icon name={item.icon} size={15}/>
              </span>
              <div className="col" style={{gap:0}}>
                <span style={{fontSize:13,fontWeight:500}}>{item.label}</span>
                {item.desc&&<span style={{fontSize:11,color:'var(--text-3)'}}>{item.desc}</span>}
              </div>
            </button>
      )}
    </div>,
    document.body
  );

  return (
    <div data-user-menu style={{position:'relative'}}>
      {dropdown}
      <button ref={btnRef} onClick={handleToggle}
        title={`${SELLER.name} — ${SELLER.company}`}
        style={{width:36,height:36,borderRadius:'50%',padding:0,border:'none',cursor:'pointer',
          background:'linear-gradient(145deg,var(--tech-2,#5BB8E8),var(--primary))',
          color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',
          fontWeight:700,fontSize:14,boxShadow:'inset 0 1px 0 rgba(255,255,255,.22)',
          outline:open?'2px solid var(--primary)':'none',outlineOffset:2}}>
        {SELLER.initials}
      </button>
    </div>
  );
}

function Topbar({route, collapsed, onToggleSidebar}){
  const openFullscreen=()=>{
    const el=document.documentElement;
    if(document.fullscreenElement){ document.exitFullscreen?.(); }
    else{ el.requestFullscreen?.(); }
  };
  return (
    <div className="topbar">
      <div className="row gap3">
        <button className="btn-icon btn-sec" onClick={onToggleSidebar} title={collapsed?'展开侧边栏':'收起侧边栏'}>
          <Icon name={collapsed?'chevR':'chevL'} size={18}/>
        </button>
        <CurrentTime/>
      </div>
      <div className="row gap3">
        <div style={{position:'relative',width:36}} title="全局搜索">
          <span style={{position:'absolute',left:10,top:9,color:'var(--text-3)',pointerEvents:'none'}}><Icon name="search" size={16}/></span>
          <input className="input" aria-label="全局搜索" title="全局搜索" placeholder="" style={{width:36,paddingLeft:34,paddingRight:0,height:36,background:'#fafbfc',color:'transparent',caretColor:'var(--text)'}}/>
        </div>
        <ThemeSwitcher placement="topbar"/>
        <LanguageSelect/>
        <button className="btn-icon btn-sec" onClick={openFullscreen} title="大屏模式"><Icon name="monitor" size={18}/></button>
        <button className="btn-icon btn-sec" style={{position:'relative'}} title="转人工通知">
          <Icon name="bell" size={18}/>
          <span style={{position:'absolute',top:6,right:6,width:8,height:8,borderRadius:'50%',background:'var(--red)',border:'2px solid #fff'}}></span>
        </button>
        <UserMenu/>
      </div>
    </div>
  );
}

function App(){
  const [route,setRoute]=useState('dashboard');
  const [profile,setProfile]=useState(null);
  const [wizard,setWizard]=useState(false);
  const [sidebarCollapsed,setSidebarCollapsed]=useState(()=>{
    try{ return localStorage.getItem('closer-sidebar-collapsed') === '1'; }catch(e){ return false; }
  });
  useEffect(()=>{
    try{ localStorage.setItem('closer-sidebar-collapsed', sidebarCollapsed?'1':'0'); }catch(e){}
  },[sidebarCollapsed]);
  const go=(r)=>{setRoute(r);};
  const openProfile=(c)=>{
    // 询盘对象 → 找到对应客户
    const cust = c.company ? (CUSTOMERS.find(x=>x.company===c.company)||{...c,inquiries:c.inquiries||1,deals:0,value:c.value||0,domain:'—',note:c.title||''}) : c;
    setProfile(cust);
  };

  return (
    <div id="app-shell" className={`row ${sidebarCollapsed?'sidebar-collapsed':''}`} style={{height:'100%',overflow:'hidden'}}>
      <Sidebar route={route} go={go} onWizard={()=>setWizard(true)} collapsed={sidebarCollapsed}/>
      <div className="col" style={{flex:1,minWidth:0,height:'100%',position:'relative'}}>
        <Topbar route={route} collapsed={sidebarCollapsed} onToggleSidebar={()=>setSidebarCollapsed(v=>!v)}/>
        <div style={{flex:1,minHeight:0,position:'relative'}}>
          {route==='dashboard' && <Dashboard go={go} onOpenProfile={openProfile}/>}
          {route==='inbox' && <InboxPage onOpenProfile={openProfile}/>}
          {route==='crm' && <CRM onOpenProfile={openProfile}/>}
          {route==='products' && <Products/>}
          {route==='quoterules' && <QuoteRules/>}
          {route==='analytics' && <Analytics/>}
          {route==='mobile' && <MobilePreview/>}
          {route==='settings' && <Settings/>}
          {route==='sysconfig' && <Sysconfig/>}

          <Drawer open={!!profile} onClose={()=>setProfile(null)} title="客户档案" width={400}>
            <CustomerProfile c={profile}/>
          </Drawer>
        </div>
      </div>
      {wizard && <Wizard onClose={()=>setWizard(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastHost><App/></ToastHost>
);

Object.assign(window, {Logo});

</script>
</body>
</html>
