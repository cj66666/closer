name: Deploy GitHub Pages Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Synnovator/Forgejo mirrors this workflow but does not provide GitHub Pages.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            docs/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- frontend demo -> /chengjiaoguan/ ---
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static demo
        working-directory: frontend
        run: npm run build:pages
        env:
          VITE_DEMO_MODE: mock
          VITE_BASE_PATH: /chengjiaoguan/

      # --- docs site -> /chengjiaoguan/docs/ ---
      - name: Export OpenAPI schema
        run: |
          python -m pip install -e .
          python scripts/export_openapi.py

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs site
        working-directory: docs
        run: npm run docs:build
        env:
          DOCS_BASE: /chengjiaoguan/docs/

      - name: Merge docs into demo artifact
        run: cp -r docs/.vitepress/dist frontend/dist/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
